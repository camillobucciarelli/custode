name: Release

# Manual only. Every merge to main used to ship a full release (App Store,
# Chrome Web Store); now a human picks the channel:
#   beta    -> GitHub pre-release tagged vX.Y.Z-beta+N, no store publishing
#   release -> GitHub release tagged vX.Y.Z+N, App Store + Chrome Web Store
# Both bump the build number and commit it to the dispatched branch.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [ beta, release ]
        default: beta

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.bump.outputs.version_name }}
      build_number: ${{ steps.bump.outputs.build_number }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PAT }}
          # Every tag is needed: the build number continues from the highest
          # one ever released, on any version line.
          fetch-depth: 0
          fetch-tags: true

      - id: bump
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT" | cut -d'+' -f1)
          OLD_BUILD=$(echo "$CURRENT" | cut -d'+' -f2)
          # One counter for the whole app, never restarted. Android refuses to
          # install an APK whose versionCode is lower than the installed one,
          # so a counter that restarts with X.Y.Z locks sideload users out of
          # the update. Taking the highest released tag as the floor makes
          # that impossible even if pubspec.yaml is edited by hand.
          MAX_TAG_BUILD=$(git tag --list 'v*+*' | sed -n 's/^v.*+\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
          MAX_TAG_BUILD=${MAX_TAG_BUILD:-0}
          FLOOR=$(( OLD_BUILD > MAX_TAG_BUILD ? OLD_BUILD : MAX_TAG_BUILD ))
          BUILD_NUMBER=$((FLOOR + 1))
          sed -i "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          # The suffix lives in the tag only: pubspec stays numeric because
          # CFBundleShortVersionString rejects "0.5.0-beta".
          SUFFIX=""
          if [[ "$CHANNEL" == "beta" ]]; then SUFFIX="-beta"; fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}${SUFFIX}+${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump build number to ${TAG}"
          git tag "$TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}" --tags

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          # Single source of truth for the pinned Flutter version: .fvmrc.
          # Do not add `flutter-version:` alongside it — the action rejects
          # both at once, and a second copy is how local and CI drift apart.
          channel: stable
          flutter-version-file: .fvmrc

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Setup Android keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" > android/key.properties

      # The checked-in list may be stale (or the empty placeholder); ship the
      # current one so passkey sign-in works from every privileged browser.
      - name: Refresh passkey privileged-browser allowlist
        run: ./tool/update_passkey_privileged_apps.sh

      - name: Build
        run: ./tool/build_prod_packages.sh --platforms android

      - name: Upload APK to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ inputs.channel == 'beta' }}
          files: dist/prod_packages/*/password_manager-android-release.apk

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          # Single source of truth for the pinned Flutter version: .fvmrc.
          # Do not add `flutter-version:` alongside it — the action rejects
          # both at once, and a second copy is how local and CI drift apart.
          channel: stable
          flutter-version-file: .fvmrc

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Build
        run: ./tool/build_prod_packages.sh --platforms linux

      - name: Upload Linux bundle to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ inputs.channel == 'beta' }}
          files: dist/prod_packages/*/password_manager-linux-release.zip

  ios:
    needs: version
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Build App Store artifact
        run: ./tool/build_prod_packages.sh --platforms ios-appstore

      - name: Upload iOS artifact to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ inputs.channel == 'beta' }}
          files: dist/prod_packages/*/password_manager-ios-appstore.ipa

      - name: Locate xcarchive
        id: locate
        run: |
          shopt -s nullglob
          archive=(dist/prod_packages/*/Runner-ios.xcarchive)
          (( ${#archive[@]} == 1 )) || { echo "Expected one iOS archive, found ${#archive[@]}"; exit 1; }
          echo "archive_dir=$(dirname "${archive[0]}")" >> "$GITHUB_OUTPUT"

      # The artifact service intermittently answers FinalizeArtifact with a 403
      # (actions/upload-artifact#560, no fix upstream); one retry has always
      # been enough. `overwrite` clears the half-created artifact from the
      # first attempt so the retry does not fail with "already exists".
      - name: Upload xcarchive artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcarchive
          path: ${{ steps.locate.outputs.archive_dir }}/Runner-ios.xcarchive
          retention-days: 1

      - name: Upload xcarchive artifact (retry)
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcarchive
          path: ${{ steps.locate.outputs.archive_dir }}/Runner-ios.xcarchive
          retention-days: 1
          overwrite: true

  ios-app-store-publish:
    needs: [ version, ios ]
    runs-on: self-hosted
    environment: app-store-ios
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - uses: actions/download-artifact@v8
        with:
          name: ios-xcarchive
          path: dist/ios-xcarchive

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          # actions/upload-artifact flattens a single-directory path, so the
          # downloaded content IS the xcarchive contents (no nested folder).
          ./tool/build_prod_packages.sh \
            --platforms ios-appstore-upload \
            --archive-path dist/ios-xcarchive \
            --no-clean

  macos:
    needs: version
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Build App Store artifact
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: ./tool/build_prod_packages.sh --platforms macos-appstore

      - name: Upload macOS artifact to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ inputs.channel == 'beta' }}
          files: dist/prod_packages/*/password_manager-macos-appstore.pkg

      - name: Build macOS Chrome Support installer
        env:
          NATIVE_HOST_PACKAGE_VERSION: ${{ needs.version.outputs.version_name }}.${{ needs.version.outputs.build_number }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: bash tool/package_native_host_macos.sh

      - name: Upload macOS Chrome Support installer to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ inputs.channel == 'beta' }}
          files: dist/keyvault-chrome-support-macos.pkg
          fail_on_unmatched_files: true

      - name: Archive xcarchive as tar
        id: locate
        run: |
          # actions/upload-artifact's zip packaging mangles symlinks/permissions
          # inside the .app bundle (Contents/Versions symlinks etc.), which makes
          # xcodebuild -exportArchive fail with "contains invalid products" when
          # the archive is re-downloaded in a different job. tar preserves them
          # byte-for-byte.
          shopt -s nullglob
          archive=(dist/prod_packages/*/Runner.xcarchive)
          (( ${#archive[@]} == 1 )) || { echo "Expected one macOS archive, found ${#archive[@]}"; exit 1; }
          tar -czf dist/macos-xcarchive.tar.gz -C "$(dirname "${archive[0]}")" "Runner.xcarchive"

      # Same FinalizeArtifact 403 flake as the iOS job; see the comment there.
      - name: Upload xcarchive artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: macos-xcarchive
          path: dist/macos-xcarchive.tar.gz
          retention-days: 1

      - name: Upload xcarchive artifact (retry)
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: macos-xcarchive
          path: dist/macos-xcarchive.tar.gz
          retention-days: 1
          overwrite: true

  macos-app-store-publish:
    needs: [ version, macos ]
    runs-on: self-hosted
    environment: app-store-macos
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - uses: actions/download-artifact@v8
        with:
          name: macos-xcarchive
          path: dist

      - name: Extract xcarchive
        run: tar -xzf dist/macos-xcarchive.tar.gz -C dist

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          ./tool/build_prod_packages.sh \
            --platforms macos-appstore-upload \
            --archive-path dist/Runner.xcarchive \
            --no-clean

  chrome:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Build extension artifact
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          [[ "${BUILD_NUMBER}" =~ ^[0-9]+$ ]] && (( BUILD_NUMBER <= 65535 )) || {
            echo "Chrome extension build number must be between 0 and 65535"
            exit 1
          }
          # The extension follows the app version (pubspec.yaml), not the
          # version written in manifest.json: a base that is bumped by hand
          # falls behind when +N resets on an X.Y.Z bump, and the Chrome Web
          # Store then rejects the upload as lower than the published one.
          jq --arg version "${VERSION_NAME}.${BUILD_NUMBER}" \
            '.version = $version' \
            desktop/browser_extension/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json desktop/browser_extension/manifest.json
          ./desktop/browser_extension/package_extension.sh

      - name: Upload extension artifact to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ inputs.channel == 'beta' }}
          files: desktop/browser_extension/dist/keyvault-browser-extension.zip

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-zip
          path: desktop/browser_extension/dist/keyvault-browser-extension.zip
          retention-days: 1

  chrome-web-store-publish:
    needs: [ version, chrome ]
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: chrome-extension-zip
          path: desktop/browser_extension/dist

      - name: Upload and publish Chrome extension
        env:
          CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_WEB_STORE_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_WEB_STORE_EXTENSION_ID }}
        run: |
          : "${CLIENT_ID:?Missing CHROME_WEB_STORE_CLIENT_ID secret}"
          : "${CLIENT_SECRET:?Missing CHROME_WEB_STORE_CLIENT_SECRET secret}"
          : "${REFRESH_TOKEN:?Missing CHROME_WEB_STORE_REFRESH_TOKEN secret}"
          : "${PUBLISHER_ID:?Missing CHROME_WEB_STORE_PUBLISHER_ID secret}"
          : "${EXTENSION_ID:?Missing CHROME_WEB_STORE_EXTENSION_ID secret}"
          [[ "${EXTENSION_ID}" == "ogjmlkogmogijgpflnjifiobdmnmommh" ]] || {
            echo "CHROME_WEB_STORE_EXTENSION_ID does not match the published KeyVault extension"
            exit 1
          }

          # The version actually being uploaded. The Chrome Web Store rejects an
          # upload whose version is not strictly higher than the published one,
          # and the extension carries its own version line (independent of
          # pubspec.yaml), so this is the first thing to check on a rejection.
          if ! uploaded_version=$(unzip -p desktop/browser_extension/dist/keyvault-browser-extension.zip manifest.json | jq -er '.version'); then
            echo "::error::Chrome Web Store: failed to read a valid manifest.json version from the extension ZIP."
            exit 1
          fi
          echo "Uploading browser extension version ${uploaded_version}"

          # Each response body is captured into a variable, so a bare
          # `--fail-with-body` swallows the reason and the log shows only
          # `curl: (22) ... 400` with no way to tell which call failed.
          # Print the body on failure; it carries the API's error message and
          # never a credential. Success bodies stay unprinted (the token one
          # holds the access token).
          if ! token_response=$(curl --fail-with-body --silent --show-error \
            https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token"); then
            echo "::error::Chrome Web Store: the OAuth token refresh was rejected."
            jq -r '"  \(.error // "unknown"): \(.error_description // "no description")"' <<<"${token_response}" 2>/dev/null \
              || echo "  response: ${token_response}"
            echo "  invalid_grant usually means CHROME_WEB_STORE_REFRESH_TOKEN was revoked or expired; invalid_client means the id/secret pair no longer matches."
            exit 1
          fi
          access_token=$(jq -er '.access_token' <<<"${token_response}")

          if ! upload_response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${access_token}" \
            -X POST \
            -T desktop/browser_extension/dist/keyvault-browser-extension.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:upload"); then
            echo "::error::Chrome Web Store: the upload of version ${uploaded_version} was rejected."
            echo "  response: ${upload_response}"
            echo "  A version that is not strictly higher than the published one is rejected here; bump \"version\" in desktop/browser_extension/manifest.json."
            exit 1
          fi
          upload_state=$(jq -er '.uploadState' <<<"${upload_response}")

          for _ in {1..60}; do
            [[ "${upload_state}" == "SUCCEEDED" ]] && break
            [[ "${upload_state}" == "IN_PROGRESS" ]] || {
              echo "Chrome Web Store upload failed: ${upload_state}"
              exit 1
            }
            sleep 5
            if ! status_response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${access_token}" \
              "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:fetchStatus"); then
              echo "::error::Chrome Web Store: the upload status check for version ${uploaded_version} was rejected."
              echo "  response: ${status_response}"
              exit 1
            fi
            upload_state=$(jq -er '.lastAsyncUploadState' <<<"${status_response}")
          done

          [[ "${upload_state}" == "SUCCEEDED" ]] || {
            echo "Chrome Web Store upload timed out"
            exit 1
          }

          if ! publish_response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${access_token}" \
            -H "Content-Type: application/json" \
            -X POST \
            --data '{"publishType":"DEFAULT_PUBLISH"}' \
            "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:publish"); then
            echo "::error::Chrome Web Store: the publish call was rejected (the upload itself succeeded)."
            echo "  response: ${publish_response}"
            exit 1
          fi
          echo "${publish_response}"

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          # Single source of truth for the pinned Flutter version: .fvmrc.
          # Do not add `flutter-version:` alongside it — the action rejects
          # both at once, and a second copy is how local and CI drift apart.
          channel: stable
          flutter-version-file: .fvmrc

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json
        shell: bash

      - name: Build
        run: ./tool/build_prod_packages.sh --platforms windows --no-clean
        shell: bash

      - name: Zip Windows bundle
        run: |
          $src = Get-ChildItem -Path dist\prod_packages -Recurse -Filter "password_manager-windows-release" -Directory | Select-Object -First 1
          $required = @(
            'desktop\native_host\install_host_windows.ps1',
            'desktop\native_host\keyvault_native_host.exe',
            'desktop\native_host\manifests\chrome\dev.camillobucciarelli.keyvault_native_host.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path $src.FullName $path))) {
              throw "Missing Windows bundle file: $path"
            }
          }
          Compress-Archive -Path "$($src.FullName)\*" -DestinationPath "$($src.Parent.FullName)\password_manager-windows-release.zip" -Force
        shell: pwsh

      - name: Upload Windows bundle to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ inputs.channel == 'beta' }}
          files: dist/prod_packages/*/password_manager-windows-release.zip
